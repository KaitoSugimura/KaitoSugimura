<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
<style>
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dasharray:1 1;stroke-dashoffset:1}to{stroke-dasharray:1 1;stroke-dashoffset:0}}
.e{animation:draw .1s cubic-bezier(.33,1,.68,1) backwards}
.w0{animation-delay:var(--b)}
.w1{animation-delay:calc(var(--b) + .1s)}
.w2,.w3{animation-delay:calc(var(--b) + .2s)}
.fill{animation:fade .3s cubic-bezier(.65,0,.35,1) backwards;animation-delay:calc(var(--b) + .17s)}
.wire{opacity:0;animation:wire .3s cubic-bezier(.65,0,.35,1) backwards;animation-delay:calc(var(--b) + .17s)}
@keyframes wire{from{opacity:1}}
.s{animation:draw .65s cubic-bezier(.33,1,.68,1) backwards;animation-delay:calc(var(--b) + .38s)}
.sd{animation:fade .2s backwards;animation-delay:calc(var(--b) + 1.03s)}
.ln{fill:none;animation:draw .9s cubic-bezier(.25,1,.5,1) backwards}
.sp{animation:spark .42s cubic-bezier(.33,1,.68,1) backwards}
@keyframes spark{0%{transform:scale(0);opacity:0}55%{transform:scale(1.12);opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.gl{display:none}}</style>
